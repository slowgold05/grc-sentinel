[project]
name = "grc-sentinel-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.4",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "psycopg[binary]==3.2.9",
  "sqlalchemy==2.0.42",
  "uvicorn[standard]==0.35.0",
  "openpyxl==3.1.5",
  "cryptography==50.0.1",
  "pypdf==6.16.2",
  "defusedxml==0.7.1",
  "dnspython==2.7.0",
  "python-docx==1.2.0",
  "boto3==1.43.83",
  "clerk-backend-api==7.0.0",
]

[dependency-groups]
dev = [
    "hypothesis==6.165.10",
    "pytest==8.4.1",
    "ruff==0.12.7",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ruleset"]
