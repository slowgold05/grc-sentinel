services:
  db:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ruleset}
      POSTGRES_USER: ${POSTGRES_USER:-ruleset}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-ruleset_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-app-role.sh:/docker-entrypoint-initdb.d/init-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
